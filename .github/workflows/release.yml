# Builds one release candidate, gates it on all five platforms, signs its
# manifest in a job that runs no candidate code, publishes it to
# @claudinite/cli-rc with trusted publishing, tags it, and smokes what the
# registry serves. Whether the publish is real is derived every run
# (release/publishmode.go): a dev signature, the dry_run input or a package
# npm does not hold yet make it a dry run that tags nothing.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, gate and sign, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - id: next
        run: echo "version=$(release/version.sh next)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.out.outputs.sums }}
      integrity: ${{ steps.out.outputs.integrity }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: "@claudinite/cli-rc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: release/build.sh
      - run: release/smoke.sh
      - run: release/repro.sh
      - run: release/secretscan.sh dist/bin
      - id: out
        run: |
          echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "integrity=$(cat dist/manifest.integrity)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: [version, build]
    name: smoke (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: linux-x64, runs-on: ubuntu-24.04 }
          - { leg: linux-arm64, runs-on: ubuntu-24.04-arm }
          - { leg: darwin-arm64, runs-on: macos-15 }
          - { leg: darwin-x64, runs-on: macos-15-intel }
          - { leg: windows-x64, runs-on: windows-2022 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: shell
        run: |
          echo "uname -s: $(uname -s), uname -m: $(uname -m)"
          if [ "${{ matrix.leg }}" = windows-x64 ]; then
            case $(uname -s) in MINGW*) ;; *) echo "::error::not Git for Windows' sh"; exit 1 ;; esac
          fi
      - name: smoke-platform against regstub
        env:
          VERSION: ${{ needs.version.outputs.version }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          stub=$PWD/.smoke
          mkdir -p "$stub"
          go build -o "$stub/regstub$(go env GOEXE)" ./release/regstub
          "$stub/regstub$(go env GOEXE)" --dist dist --ready "$stub/ready" --ca-out "$stub/ca.pem" &
          for _ in $(seq 100); do [ -f "$stub/ready" ] && break; sleep 0.1; done
          [ -f "$stub/ready" ] || { echo "::error::regstub did not start"; exit 1; }
          if [ "${{ matrix.leg }}" = windows-x64 ]; then
            # Windows curl is Schannel, which ignores CURL_CA_BUNDLE by design,
            # so the stub's certificate goes where a member's corporate root
            # would: the machine's Root store. CurrentUser\Root would raise a
            # confirmation dialog nobody is there to click.
            powershell.exe -NoProfile -NonInteractive -Command \
              "Import-Certificate -FilePath '$(cygpath -w "$stub/ca.pem")' -CertStoreLocation Cert:\LocalMachine\Root | Out-Null"
            echo "curl: $(command -v curl), $(curl --version | sed -n 1p)"
          else
            export CURL_CA_BUNDLE=$stub/ca.pem
          fi
          NO_PROXY=127.0.0.1,localhost \
            sh release/smoke-platform.sh --registry "$(cat "$stub/ready")" --package @claudinite/cli-rc \
            --version "$VERSION" --pin "$INTEGRITY" --dist dist --platform "${{ matrix.leg }}"

  sign:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: the files build hashed
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c
          sha256sum -c --quiet dist/SHA256SUMS
      - id: sign
        env:
          CN_RELEASE_KEY: ${{ secrets.CN_RELEASE_KEY }}
          CN_RELEASE_CERT: ${{ secrets.CN_RELEASE_CERT }}
        run: |
          if [ -n "$CN_RELEASE_KEY" ] || [ -n "$CN_RELEASE_CERT" ]; then
            if [ -z "$CN_RELEASE_KEY" ] || [ -z "$CN_RELEASE_CERT" ]; then
              echo "::error::the release environment holds only one of CN_RELEASE_KEY and CN_RELEASE_CERT"
              exit 1
            fi
            ( umask 077
              printf '%s\n' "$CN_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
              printf '%s\n' "$CN_RELEASE_CERT" > "$RUNNER_TEMP/release.cert.json" )
            RELEASE_KEY=$RUNNER_TEMP/release.key RELEASE_CERT=$RUNNER_TEMP/release.cert.json release/sign.sh
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            RELEASE_KEY='' RELEASE_CERT='' release/sign.sh
            echo "::notice::signed with the development key; publish runs as a dry run (#5)"
            echo "signing=dev" >> "$GITHUB_OUTPUT"
          fi
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.key" "$RUNNER_TEMP/release.cert.json"
      - run: go run ./release/manifest verify --dist dist --roots license/roots
      - id: sums
        run: echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-signed
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, sign]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-signed
          path: dist/
      - name: the files sign hashed
        env:
          SUMS: ${{ needs.sign.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c
          sha256sum -c --quiet dist/SHA256SUMS
      - id: mode
        run: |
          npm view @claudinite/cli-rc versions --json > "$RUNNER_TEMP/versions.json" 2>/dev/null || true
          go run ./release/pipeline publish-mode --channel rc --signing "${{ needs.sign.outputs.signing }}" \
            --dry-run "${{ inputs.dry_run }}" --npm-versions "$RUNNER_TEMP/versions.json" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.mode == 'real'
        run: release/publish.sh --channel rc --auth oidc
      - if: steps.mode.outputs.mode != 'real'
        run: |
          release/publish.sh --channel rc --dry-run
          echo "::notice::nothing was published, so tag and smoke-published do not run"

  tag:
    needs: [version, publish]
    if: needs.publish.outputs.mode == 'real'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

  smoke-published:
    needs: [version, build, tag]
    name: smoke-published (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: linux-x64, runs-on: ubuntu-24.04 }
          - { leg: linux-arm64, runs-on: ubuntu-24.04-arm }
          - { leg: darwin-arm64, runs-on: macos-15 }
          - { leg: darwin-x64, runs-on: macos-15-intel }
          - { leg: windows-x64, runs-on: windows-2022 }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: smoke-platform against registry.npmjs.org
        env:
          VERSION: ${{ needs.version.outputs.version }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          echo "uname -s: $(uname -s), uname -m: $(uname -m)"
          sh release/smoke-platform.sh --registry https://registry.npmjs.org --package @claudinite/cli-rc \
            --version "$VERSION" --pin "$INTEGRITY" --platform "${{ matrix.leg }}" 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: open a release-blocker issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go run ./release/pipeline blocker-issue --version "$VERSION" --leg "${{ matrix.leg }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --log "$RUNNER_TEMP/smoke.log" > "$RUNNER_TEMP/issue.md"
          gh label create release-blocker --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Holds the named version back from promotion" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label release-blocker \
            --title "$(head -n 1 "$RUNNER_TEMP/issue.md")" --body "$(tail -n +3 "$RUNNER_TEMP/issue.md")"
