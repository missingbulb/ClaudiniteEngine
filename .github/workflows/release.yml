# Builds one release of @claudinite/cli and publishes it under a dist-tag
# its kind names (release/packages.go): a full release is a candidate for
# five platforms under rc, which canaries take and promote.yml can move
# latest onto; a staging build is linux-x64 alone under staging, which only
# opted-in repos take. The build tests initial adoption on linux-x64 against
# regstub; a full release also reads the real pack shelf (live-packs, which
# holds promotion on failure) and proves its own updater moves a member off it (hop,
# release/hop.sh). Once the gates pass, the publish job signs the manifest,
# publishes every package under the one tag with trusted publishing, checks
# that npm's version documents name the bytes it built, tags the commit and
# starts from-npm.yml, which installs the release from npm once npm serves
# its tarballs, minutes later. Whether the publish
# is real is derived every run (release/publishmode.go): the dry_run input
# or a package npm does not hold yet make it a dry run that tags nothing.
# The publish job signs only with the release key of the environment
# release, certified by the root shared/trust/roots holds.
name: release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: full (rc, five platforms, every gate) or staging (linux-x64 only, for opted-in repos)
        required: true
        type: choice
        options:
          - staging
          - full
      dry_run:
        description: Build, gate and sign, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.kind.outputs.tag }}
      channel: ${{ steps.kind.outputs.channel }}
      platforms: ${{ steps.kind.outputs.platforms }}
      sums: ${{ steps.out.outputs.sums }}
      integrity: ${{ steps.out.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - id: kind
        env:
          KIND: ${{ inputs.kind }}
        run: |
          go run ./release/pipeline release-kind --kind "$KIND" > "$RUNNER_TEMP/kind"
          cat "$RUNNER_TEMP/kind" >> "$GITHUB_OUTPUT"
          echo "PLATFORMS=$(sed -n 's/^platforms=//p' "$RUNNER_TEMP/kind")" >> "$GITHUB_ENV"
      - id: next
        run: |
          version=$(release/version.sh next)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: release/build.sh
      - run: release/smoke.sh
      - if: inputs.kind == 'full'
        run: release/repro.sh
      - run: release/secretscan.sh dist/bin
      - id: out
        run: |
          echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "integrity=$(cat dist/manifest.integrity)" >> "$GITHUB_OUTPUT"
      # linux-x64 alone until there are paying customers (#47); a full release
      # still publishes all five platforms.
      - name: Test Initial Adoption on Clean Repo (linux-x64, against regstub)
        env:
          INTEGRITY: ${{ steps.out.outputs.integrity }}
          CHANNEL: ${{ steps.kind.outputs.channel }}
        run: |
          stub=$PWD/.smoke
          mkdir -p "$stub"
          go build -o "$stub/regstub" ./release/regstub
          "$stub/regstub" --dist dist --ready "$stub/ready" --ca-out "$stub/ca.pem" &
          trap 'kill $! 2>/dev/null; rm -rf "$stub"' EXIT
          for _ in $(seq 100); do [ -f "$stub/ready" ] && break; sleep 0.1; done
          [ -f "$stub/ready" ] || { echo "::error::regstub did not start"; exit 1; }
          CURL_CA_BUNDLE=$stub/ca.pem NO_PROXY=127.0.0.1,localhost \
            sh release/smoke-platform.sh --registry "$(cat "$stub/ready")" --channel "$CHANNEL" \
            --version "$VERSION" --pin "$INTEGRITY" --dist dist --platform linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The candidate against the real pack shelf. It gates promotion, not the publish: a failure
  # opens a release-blocker issue naming the version, which promote.yml then refuses.
  live-packs:
    needs: build
    if: inputs.kind == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: release/rehearse.sh --mode live-packs 2>&1 | tee "$RUNNER_TEMP/live-packs.log"
      - name: open a release-blocker issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          go run ./release/pipeline blocker-issue --gate live-packs --version "$VERSION" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --log "$RUNNER_TEMP/live-packs.log" > "$RUNNER_TEMP/issue.md"
          gh label create release-blocker --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Holds the named version back from promotion" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label release-blocker \
            --title "$(head -n 1 "$RUNNER_TEMP/issue.md")" --body "$(tail -n +3 "$RUNNER_TEMP/issue.md")"

  hop:
    needs: build
    if: inputs.kind == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: the files build hashed
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c
          sha256sum -c --quiet dist/SHA256SUMS
      - run: release/hop.sh

  # Signs and publishes in one job, the only one holding the release key and
  # the npm trust. A staging build skipped the hop; anything but success
  # from a job that ran, or a cancelled run, publishes nothing.
  publish:
    needs: [build, hop]
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && (needs.hop.result == 'success' || (inputs.kind == 'staging' && needs.hop.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      PLATFORMS: ${{ needs.build.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: the files build hashed
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c
          sha256sum -c --quiet dist/SHA256SUMS
      - id: sign
        env:
          CN_RELEASE_KEY: ${{ secrets.CN_RELEASE_KEY }}
          CN_RELEASE_CERT: ${{ secrets.CN_RELEASE_CERT }}
        run: |
          if [ -z "$CN_RELEASE_KEY" ] || [ -z "$CN_RELEASE_CERT" ]; then
            echo "::error::the release environment must hold both CN_RELEASE_KEY and CN_RELEASE_CERT (cmd/cn-keys/README.md)"
            exit 1
          fi
          ( umask 077
            printf '%s\n' "$CN_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
            printf '%s\n' "$CN_RELEASE_CERT" > "$RUNNER_TEMP/release.cert.json" )
          RELEASE_KEY=$RUNNER_TEMP/release.key RELEASE_CERT=$RUNNER_TEMP/release.cert.json release/sign.sh
          echo "signing=release" >> "$GITHUB_OUTPUT"
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.key" "$RUNNER_TEMP/release.cert.json"
      - run: go run ./release/manifest verify --dist dist --roots shared/trust/roots --platforms "$PLATFORMS"
      - id: mode
        env:
          SIGNING: ${{ steps.sign.outputs.signing }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm view @claudinite/cli versions --json > "$RUNNER_TEMP/versions.json" 2>/dev/null || true
          go run ./release/pipeline publish-mode --tag "$TAG" --signing "$SIGNING" \
            --dry-run "$DRY_RUN" --npm-versions "$RUNNER_TEMP/versions.json" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.mode == 'real'
        run: release/publish.sh --tag "$TAG" --auth oidc
      - if: steps.mode.outputs.mode == 'real'
        name: npm holds the bytes this run built
        run: go run ./release/pipeline npm-holds --dist dist --version "$VERSION"
      - if: steps.mode.outputs.mode == 'real'
        name: tag the commit
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
      - if: steps.mode.outputs.mode != 'real'
        run: |
          release/publish.sh --tag "$TAG" --dry-run
          echo "::notice::nothing was published, so no tag and no from-npm.yml"

  from-npm:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.mode == 'real' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: start from-npm.yml, which installs this release from npm once npm serves it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          gh workflow run from-npm.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" \
            -f version="$VERSION" -f integrity="$INTEGRITY" -f channel="$CHANNEL"
