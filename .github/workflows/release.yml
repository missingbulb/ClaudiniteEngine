# Builds one release of @claudinite/cli and publishes it under a dist-tag
# its kind names (dev/release/packages.go): a full release is a candidate for
# five platforms under rc, which canaries take and promote.yml can move
# latest onto; a staging build is linux-x64 alone under staging, which only
# opted-in repos take, and goes first to the staging distro's GitHub releases
# (dev/release/publish/distro.sh), which repos whose engine.releases names it
# fetch at once. The build tests initial adoption on linux-x64 against
# regstub; a full release also reads the real pack shelf (live-packs, which
# holds promotion on failure) and proves its own updater moves a member off it (hop,
# dev/release/verify/hop.sh). Once the gates pass, the publish job signs the manifest,
# tags the commit, publishes every package under the one tag with trusted
# publishing, checks that npm's version documents name the bytes it built and
# starts from-npm.yml, which installs the release from npm once npm serves
# its tarballs, minutes later. Whether the publish
# is real is derived every run (dev/release/publishmode.go): the dry_run input
# or a package npm does not hold yet make it a dry run that tags nothing.
# The publish job signs only with the release key of the environment
# release, certified by the root cn/packaging/trust/roots holds.
name: release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: full (rc, five platforms, every gate) or staging (linux-x64 only, for opted-in repos)
        required: true
        type: choice
        options:
          - staging
          - full
      dry_run:
        description: Build, gate and sign, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.kind.outputs.tag }}
      channel: ${{ steps.kind.outputs.channel }}
      platforms: ${{ steps.kind.outputs.platforms }}
      sums: ${{ steps.out.outputs.sums }}
      integrity: ${{ steps.out.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - id: kind
        env:
          KIND: ${{ inputs.kind }}
        run: dev/release/kind.sh "$KIND"
      - id: next
        run: dev/build/next-version.sh
      - run: dev/release/create/build.sh
      - run: dev/release/verify/smoke.sh
      - if: inputs.kind == 'full'
        run: dev/release/verify/repro.sh
      - run: dev/release/verify/secretscan.sh dist/bin
      - id: out
        run: dev/release/create/dist-id.sh
      - name: Test Initial Adoption on Clean Repo (linux-x64, against regstub)
        env:
          INTEGRITY: ${{ steps.out.outputs.integrity }}
          CHANNEL: ${{ steps.kind.outputs.channel }}
        run: dev/release/verify/adoption.sh --channel "$CHANNEL" --version "$VERSION" --pin "$INTEGRITY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The candidate against the real pack shelf. It gates promotion, not the publish: a failure
  # opens a release-blocker issue naming the version, which promote.yml then refuses.
  live-packs:
    needs: build
    if: inputs.kind == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: dev/release/verify/rehearse.sh --mode live-packs 2>&1 | tee "$RUNNER_TEMP/live-packs.log"
      - name: open a release-blocker issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: dev/release/verify/blocker-issue.sh --gate live-packs --version "$VERSION" --log "$RUNNER_TEMP/live-packs.log"

  hop:
    needs: build
    if: inputs.kind == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: the files build hashed
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: dev/release/verify/sums.sh "$SUMS"
      - run: dev/release/verify/hop.sh

  # Signs and publishes in one job, the only one holding the release key and
  # the npm trust. A staging build skipped the hop; anything but success
  # from a job that ran, or a cancelled run, publishes nothing.
  publish:
    needs: [build, hop]
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && (needs.hop.result == 'success' || (inputs.kind == 'staging' && needs.hop.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      PLATFORMS: ${{ needs.build.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: the files build hashed
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: dev/release/verify/sums.sh "$SUMS"
      # The key exists only inside this step, and the signature is verified
      # against the roots a released cn trusts before anything is published.
      - id: sign
        env:
          CN_RELEASE_KEY: ${{ secrets.CN_RELEASE_KEY }}
          CN_RELEASE_CERT: ${{ secrets.CN_RELEASE_CERT }}
        run: dev/release/create/sign-release.sh
      - id: mode
        env:
          SIGNING: ${{ steps.sign.outputs.signing }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: dev/release/publish/mode.sh --tag "$TAG" --signing "$SIGNING" --dry-run "$DRY_RUN"
      - if: steps.mode.outputs.mode == 'real'
        name: tag the commit
        run: dev/release/publish/tag.sh "$VERSION"
      # A staging build reaches engine.releases repos the moment this upload
      # ends; npm serves it minutes later.
      - if: steps.mode.outputs.mode == 'real' && inputs.kind == 'staging'
        name: upload to the staging distro
        env:
          GH_TOKEN: ${{ secrets.STAGING_DISTRO_TOKEN }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: dev/release/publish/distro.sh --version "$VERSION" --integrity "$INTEGRITY" --commit "$GITHUB_SHA"
      - if: steps.mode.outputs.mode == 'real'
        run: dev/release/publish/publish.sh --tag "$TAG" --auth oidc
      - if: steps.mode.outputs.mode == 'real'
        name: npm holds the bytes this run built
        run: go run ./dev/release/pipeline npm-holds --dist dist --version "$VERSION" --channel "$CHANNEL" --repo "$GITHUB_REPOSITORY"
      - if: steps.mode.outputs.mode != 'real' && inputs.kind == 'staging'
        env:
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: dev/release/publish/distro.sh --version "$VERSION" --integrity "$INTEGRITY" --commit "$GITHUB_SHA" --dry-run
      - if: steps.mode.outputs.mode != 'real'
        run: dev/release/publish/publish.sh --tag "$TAG" --dry-run

  from-npm:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.mode == 'real' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: start from-npm.yml, which installs this release from npm once npm serves it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          gh workflow run from-npm.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" \
            -f version="$VERSION" -f integrity="$INTEGRITY" -f channel="$CHANNEL"
