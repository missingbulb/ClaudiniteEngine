# The full check: every test short mode skips, the rehearsal's release built, signed, smoked
# and rehearsed, the ported packs' suites against this cn, and the per-call hooks' latency
# budgets. Nightly and on demand, and promote.yml runs it on the version it is about to make
# stable. A red nightly opens, or comments on, one issue.
name: full

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check; empty is the calling run's own
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The parity harness is off CI: the port it proved is done (design record 135).
      - run: go list ./... | grep -v /parity | xargs go test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The rehearsal's release: built with the development roots and signed with the
      # development keys (dev/testkeys/), which dev/release/rehearse.sh's every key chains to.
      - run: dev/release/build.sh
        env:
          VERSION: "1.61001.1"
          REHEARSAL: "1"
          BUILD_TAGS: devroots
      - run: dev/release/sign.sh
        env:
          RELEASE_KEY: dev/testkeys/release.key
          RELEASE_CERT: dev/testkeys/release.cert.json
          ROOTS: cn/shared/trust/devroots
      - run: sha256sum -c dist/SHA256SUMS
      - run: dev/release/smoke.sh
      - run: dev/release/repro.sh
        env:
          VERSION: "1.61001.1"
      - run: dev/release/secretscan.sh dist/bin
      # Named apart from a calling release's own dist, since a called workflow shares its run's artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-rehearsal-dist
          path: dist/
          if-no-files-found: error

  rehearse:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The dashboard mode's step 5 publishes the real dashboard pack, from ClaudinitePacks at the pinned commit.
      - id: packs
        run: echo "ref=$(cat dev/claudinitepacks.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: missingbulb/ClaudinitePacks
          ref: ${{ steps.packs.outputs.ref }}
          path: claudinitepacks
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-rehearsal-dist
          path: dist/
      - run: dev/release/rehearse.sh
        env:
          CLAUDINITE_PACKS_TREE: ${{ github.workspace }}/claudinitepacks

  packs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The hook-latency probe's payloads are the frozen Node shelf's packs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: missingbulb/Claudinite
          ref: 057841ac43de1f90b821f7a57e0f3d21eb6ff0e7
          path: claudinite-frozen
          persist-credentials: false
      - id: packs
        run: echo "ref=$(cat dev/claudinitepacks.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: missingbulb/ClaudinitePacks
          ref: ${{ steps.packs.outputs.ref }}
          path: claudinitepacks
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: go build -o "$RUNNER_TEMP/cn" ./cn
      # The ported packs' Go tests and cn check --pack fixtures, against this cn, until
      # ClaudinitePacks pins a published one (#2).
      - run: sh tools/checks/test.sh
        working-directory: claudinitepacks
        env:
          CLAUDINITE_CN: ${{ runner.temp }}/cn
      # The dashboard pack's suite, against this cn.
      - run: node --test 'packs/claudinite-dashboard/test/**/*.test.mjs'
        working-directory: claudinitepacks
        env:
          CLAUDINITE_CN: ${{ runner.temp }}/cn
      # The per-call hooks' latency on the runner, held to its budgets; the table lands in the log.
      - run: |
          rc=0
          sh rewrite-temp/probe/hook-latency/run.sh --node claudinite-frozen --out "$RUNNER_TEMP/hook-latency" --budget || rc=$?
          cat "$RUNNER_TEMP"/hook-latency/*.md
          exit "$rc"

  report:
    needs: [test, build, rehearse, packs]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          title="The nightly full check is red"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" > open.json
          number=$(jq -r --arg t "$title" 'map(select(.title == $t and (.pull_request | not))) | first | .number // empty' open.json)
          body="$(date -u +%F): $RUN_URL failed. After a fix, run full from the Actions tab to confirm."
          if [ -n "$number" ]; then
            jq -n --arg b "$body" '{body: $b}' | curl -fsS -H "Authorization: Bearer $GH_TOKEN" -X POST "$api/issues/$number/comments" -d @- > /dev/null
          else
            jq -n --arg t "$title" --arg b "$body" '{title: $t, body: $b}' | curl -fsS -H "Authorization: Bearer $GH_TOKEN" -X POST "$api/issues" -d @- > /dev/null
          fi
