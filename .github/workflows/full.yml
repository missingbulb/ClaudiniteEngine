# The full check: every test short mode skips, the rehearsal's release built, signed, smoked
# and rehearsed, the ported packs' suites against this cn, and the per-call hooks' latency
# budgets. Nightly and on demand, and promote.yml runs it on the version it is about to make
# stable. A red nightly opens, or comments on, one issue.
name: full

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check; empty is the calling run's own
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: dev/test/test.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The rehearsal's release: built with the development roots and signed with the
      # development keys (dev/release/keys/testkeys/), which dev/release/verify/rehearse.sh's every key chains to.
      - run: dev/release/create/build.sh
        env:
          VERSION: "1.61001.1"
          REHEARSAL: "1"
          BUILD_TAGS: devroots
      - run: dev/release/create/sign.sh
        env:
          RELEASE_KEY: dev/release/keys/testkeys/release.key
          RELEASE_CERT: dev/release/keys/testkeys/release.cert.json
          ROOTS: cn/packaging/trust/devroots
      - run: dev/release/verify/sums.sh
      - run: dev/release/verify/smoke.sh
      - run: dev/release/verify/repro.sh
        env:
          VERSION: "1.61001.1"
      - run: dev/release/verify/secretscan.sh dist/bin
      # Named apart from a calling release's own dist, since a called workflow shares its run's artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-rehearsal-dist
          path: dist/
          if-no-files-found: error

  rehearse:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-rehearsal-dist
          path: dist/
      - run: dev/release/verify/rehearse.sh

  packs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: packs
        run: echo "ref=$(cat dev/test/claudinitepacks.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: missingbulb/ClaudinitePacks
          ref: ${{ steps.packs.outputs.ref }}
          path: claudinitepacks
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      # ClaudinitePacks' suites against this cn, until it pins a published one (#2), and the
      # per-call hooks' latency on the runner, held to its budgets; the table lands in the log.
      - run: dev/test/packs.sh claudinitepacks

  report:
    needs: [test, build, rehearse, packs]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: dev/test/report-red.sh "$RUN_URL"
