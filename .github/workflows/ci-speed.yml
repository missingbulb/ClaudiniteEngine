# The fast check's speed budget: daily, the p75 wall time of ci.yml's successful runs over the
# last seven days against 60 seconds. Over it, one issue is opened or commented on, for the
# routine that works it; back under it, that issue closes.
name: ci-speed

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p75:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: dev/test/ci-speed.sh "$RUN_URL"
