name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
      - run: go test ./...
      - run: shellcheck -s sh launcher/launch release/*.sh probe/desktop-timings/run.sh probe/hook-latency/run.sh
      # actionlint v1.7.11, the last release that builds on Go 1.24, over the engine's workflows and
      # the member templates; it runs shellcheck over every run: body too.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8 .github/workflows/*.yml lifecycle/workflows/templates/*.yml

  # The two-engine harness: the frozen Node engine, pinned by commit, against cn.
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: missingbulb/Claudinite
          ref: 057841ac43de1f90b821f7a57e0f3d21eb6ff0e7
          path: claudinite-frozen
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: go build -o "$RUNNER_TEMP/cn" ./cmd/cn
      - run: go test ./parity -run 'Parity|Differential' -v
        env:
          CLAUDINITE_NODE_ENGINE: ${{ github.workspace }}/claudinite-frozen
          CLAUDINITE_PARITY_TREES: ${{ github.workspace }}/claudinite-frozen
          CLAUDINITE_CN: ${{ runner.temp }}/cn
      # The per-call hooks' latency on the runner, over the frozen tree's packs, held to its budgets; the table lands in the log.
      - run: |
          rc=0
          sh probe/hook-latency/run.sh --node claudinite-frozen --out "$RUNNER_TEMP/hook-latency" --budget || rc=$?
          cat "$RUNNER_TEMP"/hook-latency/*.md
          exit "$rc"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: release/build.sh
        env:
          VERSION: "1.1.0"
      - run: release/sign.sh
      - run: sha256sum -c dist/SHA256SUMS
      - run: release/smoke.sh
      - run: release/repro.sh
        env:
          VERSION: "1.1.0"
      - run: release/secretscan.sh dist/bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  rehearse:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: release/rehearse.sh
