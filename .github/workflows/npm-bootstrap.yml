# One-shot: reserves the 13 @claudinite npm packages at 0.0.0 with
# NPM_BOOTSTRAP_TOKEN (#2), then posts on #2 the trusted-publisher checklist
# npmjs.com needs, which no CLI or API can set. Reruns skip what exists.
name: npm-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - id: token
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$NPM_BOOTSTRAP_TOKEN" ]; then
            echo "::notice::NPM_BOOTSTRAP_TOKEN is not set; see #2"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - if: steps.token.outputs.present == 'true'
        run: npm install -g npm@11.21.0
      - if: steps.token.outputs.present == 'true'
        run: |
          VERSION=0.0.0 PACKAGE=@claudinite/cli-rc DIST=dist-rc release/build.sh
          VERSION=0.0.0 PACKAGE=@claudinite/cli DIST=dist-stable release/build.sh --placeholder-sdk
      - if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          VERSION: "0.0.0"
        run: |
          DIST=dist-rc release/publish.sh --channel rc --auth token --skip-existing
          DIST=dist-stable release/publish.sh --channel stable --auth token --skip-existing
      - if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./release/pipeline bootstrap-comment > "$RUNNER_TEMP/comment.md"
          first=$(head -n 1 "$RUNNER_TEMP/comment.md")
          if gh issue view 2 --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF -- "$first"; then
            echo "::notice::the checklist is already on #2"
          else
            gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
