# Installs one published release from registry.npmjs.org on a clean repo,
# once npm serves its tarballs, which can take minutes after the publish.
# release.yml starts it after a real publish and finishes without it: the
# release's publish job already proved npm holds the bytes it built and
# tested. A failure opens a release-blocker issue, which holds the version
# back from promotion.
name: Test Initial Adoption on Clean Repo, from npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: The published version, like 1.61005.4
        required: true
        type: string
      integrity:
        description: The manifest package's sha512 integrity, the pin a repo writes
        required: true
        type: string
      channel:
        description: The engine channel the release's dist-tag serves
        required: true
        type: string

permissions:
  contents: read

jobs:
  from-npm:
    name: from npm (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg until there are paying customers (#47); a full
          # release still publishes all five platforms.
          - { leg: linux-x64, runs-on: ubuntu-24.04 }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      issues: write
    env:
      LEG: ${{ matrix.leg }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: wait for npm to serve the published tarballs
        run: sh dev/release/verify/npm-wait.sh --package @claudinite/cli --version "$VERSION" --platform "$LEG" | tee "$RUNNER_TEMP/smoke.log"
      - name: smoke-platform against registry.npmjs.org
        env:
          INTEGRITY: ${{ inputs.integrity }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          sh dev/release/verify/smoke-platform.sh --registry https://registry.npmjs.org --channel "$CHANNEL" \
            --version "$VERSION" --pin "$INTEGRITY" --platform "$LEG" 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: open a release-blocker issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: dev/release/verify/blocker-issue.sh --leg "$LEG" --version "$VERSION" --log "$RUNNER_TEMP/smoke.log"
