# Promotes one version of @claudinite/cli: moves its latest dist-tag onto
# an rc version, the bytes, manifest and signature the canaries ran, and
# republishes nothing. gate reads npm, the open release-blocker issues and
# the registered canaries' conclusions; check re-verifies the downloaded
# bytes, refuses a staging build, which lacks four platforms, and runs the
# candidate's stable build check; promote runs npm dist-tag add in the
# promote environment, the trusted publisher of @claudinite/cli allowed to
# move dist-tags. With no canary workflow named the gate answers
# no-canaries, which passes only when the dispatch's confirm input repeats
# the version. The hourly schedule lands with the first canary workflow
# named in release/canaries.json.
#
# action hold or revoke instead marks the version on npm with a "held:" or
# "revoked:" deprecation, which the updater and cn check world read;
# release clears it. npm's trusted publishing covers publish and dist-tag
# only, not deprecate (https://docs.npmjs.com/trusted-publishers), so the
# deprecate job runs npm deprecate with NPM_DEPRECATE_TOKEN, a token the
# promote environment holds; without it the job fails naming the secret,
# the commands kept in its summary. A version npm does not have is refused
# with a notice and a green run.
#
# action unpublish removes the version from @claudinite/cli and its
# platform packages with npm unpublish, on the same token and environment.
# It needs confirm to repeat the version, and refuses, failing before any
# unpublish, when npm cannot be read, the version is the one latest points
# at, or it is the only one any of those packages holds, since npm deletes
# a package whose last version is unpublished. Both jobs stop at the first
# npm command that fails.
name: promote

on:
  workflow_dispatch:
    inputs:
      action:
        description: promote the version (move latest onto it), hold or revoke it on npm, release a hold or revocation, or unpublish it
        required: true
        type: choice
        default: promote
        options:
          - promote
          - hold
          - revoke
          - release
          - unpublish
      version:
        description: The @claudinite/cli version to act on
        required: true
        type: string
      reason:
        description: For hold and revoke, the one-line reason the deprecation carries (empty for release)
        required: false
        type: string
        default: ""
      confirm:
        description: The version again, to promote with no canary registered, or to unpublish
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    if: inputs.action == 'promote'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      hop: ${{ steps.gate.outputs.hop }}
      allowed: ${{ steps.allowed.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: go run ./release/promote gate --version "$VERSION" --canaries release/canaries.json >> "$GITHUB_OUTPUT"
      - id: allowed
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          HOP: ${{ steps.gate.outputs.hop }}
        run: |
          allowed=false
          case $VERDICT in
            pass) allowed=true; why="every gate passed" ;;
            no-canaries)
              if [ "$CONFIRM" = "$VERSION" ]; then
                allowed=true; why="no canary is registered, and the dispatch typed the version twice"
              else
                why="no canary is registered; dispatch again with confirm set to the version to promote anyway"
              fi ;;
            *) why="the gate answered $VERDICT" ;;
          esac
          {
            echo "### Promotion of @claudinite/cli $VERSION"
            echo
            echo "- gate: \`$VERDICT\` ($why)"
            echo "- hop: \`$HOP\` (advisory until a canary runs candidates; release.yml's hop job proved this candidate's updater before it was published)"
            echo "- promoting: $allowed"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::gate $VERDICT, $HOP: $why"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      check: ${{ steps.check.outputs.check }}
      stable_test: ${{ steps.check.outputs.stable_test }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          path: candidate
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # A staging build has no tarball on four platform packages; check
      # names it as one from its manifest.
      - name: download the candidate's tarballs
        run: |
          mkdir candidate-tarballs
          for name in $(go run ./release/pipeline names); do
            npm pack "$name@$VERSION" --pack-destination candidate-tarballs --silent \
              || echo "::notice::npm has no $name@$VERSION"
          done
          for f in candidate-tarballs/claudinite-*.tgz; do mv "$f" "candidate-tarballs/$(basename "$f" | sed 's/^claudinite-//')"; done
          ls -l candidate-tarballs
      - id: check
        run: go run ./release/promote check --version "$VERSION" --tarballs candidate-tarballs --roots shared/trust/roots --source candidate >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.check != 'pass'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "### $VERSION not promoted: $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::promote check refused $VERSION: $REASON"
          exit 1

  deprecate:
    if: inputs.action == 'hold' || inputs.action == 'revoke' || inputs.action == 'release'
    runs-on: ubuntu-24.04
    environment: promote
    permissions:
      contents: read
    env:
      ACTION: ${{ inputs.action }}
      VERSION: ${{ inputs.version }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm deprecate
        env:
          NPM_DEPRECATE_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/versions/@claudinite"
          for name in $(go run ./release/pipeline names); do
            out=$RUNNER_TEMP/versions/$name.json
            if ! npm view "$name" versions --json > "$out" 2> "$RUNNER_TEMP/view.err"; then
              if grep -q E404 "$out" "$RUNNER_TEMP/view.err"; then
                : > "$out"
              else
                echo "::error::npm view $name failed, so which packages hold $VERSION is unknown; nothing deprecated: $(cat "$out" "$RUNNER_TEMP/view.err" | tr '\n' ' ')"
                exit 1
              fi
            fi
          done
          go run ./release/pipeline deprecate-commands --action "$ACTION" --version "$VERSION" --reason "$REASON" \
            --versions-dir "$RUNNER_TEMP/versions" > "$RUNNER_TEMP/commands.sh"
          if [ ! -s "$RUNNER_TEMP/commands.sh" ]; then
            echo "### $ACTION $VERSION: npm has no such version; nothing done" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### $ACTION $VERSION"
            echo
            echo '```'
            cat "$RUNNER_TEMP/commands.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$NPM_DEPRECATE_TOKEN" ]; then
            echo "::error::the promote environment has no NPM_DEPRECATE_TOKEN secret, an npm token with write access to @claudinite; add it and dispatch again (the commands are in this job's summary)"
            exit 1
          fi
          NODE_AUTH_TOKEN=$NPM_DEPRECATE_TOKEN sh -e "$RUNNER_TEMP/commands.sh"
          echo "deprecated now: $(npm view "@claudinite/cli@$VERSION" deprecated)" >> "$GITHUB_STEP_SUMMARY"

  unpublish:
    if: inputs.action == 'unpublish'
    runs-on: ubuntu-24.04
    environment: promote
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: confirm
        run: |
          if [ "$CONFIRM" != "$VERSION" ]; then
            echo "::error::unpublish cannot be undone; dispatch again with confirm set to the version, $VERSION"
            echo "### unpublish $VERSION: refused, confirm does not repeat the version; nothing unpublished" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm unpublish
        env:
          NPM_DEPRECATE_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}
        run: |
          if ! npm view @claudinite/cli dist-tags --json > "$RUNNER_TEMP/dist-tags.json" 2> "$RUNNER_TEMP/view.err"; then
            echo "::error::npm view @claudinite/cli dist-tags failed, so whether $VERSION is latest is unknown; nothing unpublished: $(cat "$RUNNER_TEMP/dist-tags.json" "$RUNNER_TEMP/view.err" | tr '\n' ' ')"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/versions/@claudinite"
          for name in $(go run ./release/pipeline names); do
            out=$RUNNER_TEMP/versions/$name.json
            if ! npm view "$name" versions --json > "$out" 2> "$RUNNER_TEMP/view.err"; then
              if grep -q E404 "$out" "$RUNNER_TEMP/view.err"; then
                : > "$out"
              else
                echo "::error::npm view $name failed, so whether $VERSION is its only version is unknown; nothing unpublished: $(cat "$out" "$RUNNER_TEMP/view.err" | tr '\n' ' ')"
                exit 1
              fi
            fi
          done
          if ! go run ./release/pipeline unpublish-commands --version "$VERSION" --versions-dir "$RUNNER_TEMP/versions" \
            --dist-tags "$RUNNER_TEMP/dist-tags.json" > "$RUNNER_TEMP/commands.sh"; then
            echo "### unpublish $VERSION: refused; nothing unpublished (the error is in this job's log)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/commands.sh" ]; then
            echo "### unpublish $VERSION: npm has no such version; nothing done" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### unpublish $VERSION"
            echo
            echo '```'
            cat "$RUNNER_TEMP/commands.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$NPM_DEPRECATE_TOKEN" ]; then
            echo "::error::the promote environment has no NPM_DEPRECATE_TOKEN secret, an npm token with write access to @claudinite; add it and dispatch again (the commands are in this job's summary)"
            exit 1
          fi
          NODE_AUTH_TOKEN=$NPM_DEPRECATE_TOKEN sh -e "$RUNNER_TEMP/commands.sh"
          echo "versions now: $(npm view @claudinite/cli versions --json | tr -d '\n ')" >> "$GITHUB_STEP_SUMMARY"

  # Moves latest; npm's trusted publishing authorizes dist-tag for the
  # promote environment's publisher of @claudinite/cli.
  promote:
    needs: [gate, check]
    if: needs.check.outputs.check == 'pass'
    runs-on: ubuntu-24.04
    environment: promote
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.0
      - name: npm dist-tag add
        run: |
          before=$(npm view @claudinite/cli dist-tags.latest)
          if ! npm_config_loglevel=verbose npm dist-tag add "@claudinite/cli@$VERSION" latest; then
            echo "::error::npm refused to move latest onto $VERSION; check the promote.yml trusted publisher of @claudinite/cli and its Allow npm dist-tag box on https://github.com/missingbulb/ClaudiniteEngine/issues/2"
            exit 1
          fi
          after=$(npm view @claudinite/cli dist-tags.latest)
          echo "### latest: $before -> $after" >> "$GITHUB_STEP_SUMMARY"
          if [ "$after" != "$VERSION" ]; then
            echo "::error::npm accepted the dist-tag, but latest reads $after, not $VERSION"
            exit 1
          fi
