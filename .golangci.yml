# Capability boundaries (docs/design.md, "Code structure"): each capability
# folder imports only the standard library and shared/. Tool folders (cmd/,
# release/, launcher/, probe/) may import capabilities. Every exception is a
# commented entry here.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    errcheck:
      # Diagnostic and protocol output goes to the process's stdout and
      # stderr; when those fail there is no channel left to report on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # A capability may also import its own sub-packages (checks/build
        # from checks, lifecycle/packs from lifecycle/update): code grows
        # inside its capability, never across.
        capabilities:
          list-mode: strict
          files:
            - "**/hooks/**"
            - "**/license/**"
            - "**/tasks/**"
            - "**/growth/**"
            - "**/sdkserver/**"
            - "**/shared/**"
            - "!**/shared/descriptor/**"
            - "!**/shared/skilltriggers/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
        skilltriggers:
          # The skills' force-load patterns are written for the ECMAScript
          # regex engine, as the declared checks' are, so the trigger
          # grammar takes regexp2 too.
          list-mode: strict
          files:
            - "**/shared/skilltriggers/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
            - github.com/dlclark/regexp2
        descriptor:
          # The one place the descriptor formats' parsers are imported
          # (pack, declared-checks and settings in JSON, YAML or TOML);
          # every other package reads descriptors through it.
          list-mode: strict
          files:
            - "**/shared/descriptor/**"
          allow:
            - $gostd
            - go.yaml.in/yaml/v3
            - github.com/BurntSushi/toml
        lifecycle:
          list-mode: strict
          files:
            - "**/lifecycle/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
            - github.com/missingbulb/ClaudiniteEngine/lifecycle
        checks:
          list-mode: strict
          files:
            - "**/checks/**"
            - "!**/checks/declared/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
            - github.com/missingbulb/ClaudiniteEngine/checks/
        checks-declared:
          # The declarative check engine also takes the ECMAScript regex
          # engine the shelf's patterns are written for (lookaround,
          # backreferences, a match timeout), which RE2 cannot express.
          list-mode: strict
          files:
            - "**/checks/declared/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
            - github.com/missingbulb/ClaudiniteEngine/checks/declared
            - github.com/dlclark/regexp2
        parity:
          # The two-engine harness drives both engines as black boxes: it
          # imports nothing of the engine, so a scenario cannot pass by
          # calling the code it measures.
          list-mode: strict
          files:
            - "**/parity/**"
          allow:
            - $gostd
        checksdk:
          # The public Go check SDK, the one package a pack's Go may import:
          # standard library only, since a pack's checks build offline.
          list-mode: strict
          files:
            - "**/checksdk/**"
          allow:
            - $gostd
        key-ceremony-tool:
          # The key-ceremony workflow builds cn-keys from this public tree
          # with no module downloads: standard library and shared/ only.
          list-mode: strict
          files:
            - "**/cmd/cn-keys/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
