# Capability boundaries (docs/design.md, "Code structure"): each capability
# imports only the standard library and the common packages listed under
# "common" below. Tool folders (cn's own command files, the launcher, dev/)
# may import capabilities. Every exception is a commented entry here.
#
# The common packages are the ones the engine's former shared/ folder held,
# now each living in its segment; each rule names them in full.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    errcheck:
      # Diagnostic and protocol output goes to the process's stdout and
      # stderr; when those fail there is no channel left to report on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # A capability may also import its own sub-packages (checks/build
        # from checks, packaging/fetch from packaging/update): code grows
        # inside its capability, never across.
        common:
          list-mode: strict
          files:
            - "**/integrations/hooks/**"
            - "**/sdkserver/**"
            - "**/packaging/packset/**"
            - "**/packaging/settings/**"
            - "**/packaging/descriptor/**"
            - "**/packaging/packindex/**"
            - "**/packaging/version/**"
            - "**/packaging/sign/**"
            - "**/packaging/trust/**"
            - "**/packaging/npmreg/**"
            - "**/packaging/ghrelease/**"
            - "**/packaging/interview/**"
            - "**/packaging/flatdecl/**"
            - "**/capabilities/skills/skillfm/**"
            - "**/capabilities/skills/skilltriggers/**"
            - "**/capabilities/checks/findings/**"
            - "**/capabilities/tasks/taskspec/**"
            - "**/capabilities/tasks/mergepolicy/**"
            - "**/growth/retention/**"
            - "**/growth/provenance/**"
            - "**/integrations/transcript/**"
            - "**/fleet/licenseapi/**"
            - "**/integrations/github/githubapi/**"
            - "**/integrations/github/gitcmd/**"
            - "**/capabilities/tasks/workitem/**"
            - "**/fleet/curation/**"
            - "**/fleet/packseed/**"
            - "**/helpers/**"
            - "!**/packaging/descriptor/**"
            - "!**/helpers/jsregex/**"
            - "!**/capabilities/tasks/mergepolicy/**"
            - "!**/capabilities/tasks/taskspec/**"
            - "!**/growth/provenance/verbs/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
        growth:
          list-mode: strict
          files:
            - "**/growth/**"
            - "**/packaging/userpack/**"
            - "**/packaging/scaffold/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/growth
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/userpack
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/scaffold
            # The usage fold counts task runs as well as sessions, so it reads
            # the queue's run records and outcome vocabulary.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/queue
        fleet:
          list-mode: strict
          files:
            - "**/fleet/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet
            # The fleet pack's built-in checks live with the fleet and
            # register with the engine's built-ins.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/builtin
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/declared
        tasks:
          list-mode: strict
          files:
            - "**/capabilities/tasks/**"
            - "**/integrations/github/ghport/**"
            - "!**/capabilities/tasks/mergepolicy/**"
            - "!**/capabilities/tasks/taskspec/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/ghport
            # The usage-fold task's precondition reads how far the fold has
            # read the runs, which the fold itself writes.
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/usage
        jsregex:
          # Pack data writes its patterns for the ECMAScript regex engine
          # (a skill's force-load triggers, a pack's merge rules), as the
          # declared checks' are, so the one reader of them takes regexp2.
          list-mode: strict
          files:
            - "**/helpers/jsregex/**"
          allow:
            - $gostd
            - github.com/dlclark/regexp2
        mergepolicy:
          # The merge policy judges an edit's shape with the SDK's scanning
          # helpers (comment-only), so a coded check, a declared one and the
          # landing lane read a file the same way.
          list-mode: strict
          files:
            - "**/capabilities/tasks/mergepolicy/**"
            # The task contract reads a task-local preconditions.mjs as
            # text, comments stripped the way a check strips them.
            - "**/capabilities/tasks/taskspec/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/checksdk
        descriptor:
          # The one place the descriptor formats' parsers are imported
          # (pack, declared-checks and settings in JSON, YAML or TOML);
          # every other package reads descriptors through it.
          list-mode: strict
          files:
            - "**/packaging/descriptor/**"
          allow:
            - $gostd
            - go.yaml.in/yaml/v3
            - github.com/BurntSushi/toml
        lifecycle:
          # The engine's own lifecycle: adoption, fetching packs, the
          # update, the self-test, verify, the rules index and the member's
          # workflows.
          list-mode: strict
          files:
            - "**/packaging/adopt/**"
            - "**/packaging/fetch/**"
            - "**/packaging/update/**"
            - "**/packaging/selftest/**"
            - "**/packaging/verify/**"
            - "**/capabilities/rules/rulesindex/**"
            - "**/integrations/workflows/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/adopt
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/fetch
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/update
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/selftest
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/verify
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/rules/rulesindex
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/workflows
            # One landing lane for every pull request a run delivers: the
            # update's landing enters it at the pinned-sha merge, so the
            # update and a task cannot drift on how a PR lands.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/land
            # The queue's two workflow templates are the tasks capability's;
            # the member's workflows are written and diffed here with them.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workflows
            # Verify reads the settings' tasks block as the queue does, so a
            # value the queue would refuse breaks before an update lands.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/config
            # The skills probe reads a skill's links as the checks do, skipping
            # code spans and fenced blocks, so an example link is never a miss.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/checksdk
        checks:
          list-mode: strict
          files:
            - "**/checks/**"
            - "**/packaging/pinguard/**"
            - "!**/checks/declared/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/
            # The engine side of the coded checks' pipe: the run hands each
            # built checks binary a server answering its SDK calls.
            # The SDK sources a pack's checks build compiles against.
        checks-declared:
          # The declarative check engine also takes the ECMAScript regex
          # engine the shelf's patterns are written for (lookaround,
          # backreferences, a match timeout), which RE2 cannot express.
          list-mode: strict
          files:
            - "**/checks/declared/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packset
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/settings
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/descriptor
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/packindex
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/version
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/trust
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/npmreg
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/ghrelease
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/interview
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/flatdecl
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skillfm
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/skills/skilltriggers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/findings
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/taskspec
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/mergepolicy
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/retention
            - github.com/missingbulb/ClaudiniteEngine/cn/growth/provenance
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/transcript
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/githubapi
            - github.com/missingbulb/ClaudiniteEngine/cn/integrations/github/gitcmd
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/tasks/workitem
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/curation
            - github.com/missingbulb/ClaudiniteEngine/cn/fleet/packseed
            - github.com/missingbulb/ClaudiniteEngine/cn/helpers
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/declared
            - github.com/dlclark/regexp2
            # The scanning helpers the declared views share with coded
            # checks (comment stripping, fence blanking) live in the SDK,
            # so the two engines read a file the same way.
            - github.com/missingbulb/ClaudiniteEngine/cn/capabilities/checks/checksdk
        parity:
          # The two-engine harness drives both engines as black boxes: it
          # imports nothing of the engine, so a scenario cannot pass by
          # calling the code it measures.
          list-mode: strict
          files:
            - "**/parity/**"
          allow:
            - $gostd
        checksdk:
          # The public Go check SDK, the one package a pack's Go may import:
          # standard library only, since a pack's checks build offline.
          list-mode: strict
          files:
            - "**/checksdk/**"
          allow:
            - $gostd
        key-ceremony-tool:
          # The key-ceremony workflow builds cn-keys from this public tree
          # with no module downloads: the standard library and the signing
          # package only.
          list-mode: strict
          files:
            - "**/release/keys/cn-keys/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/cn/packaging/sign
