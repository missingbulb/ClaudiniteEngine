# Capability boundaries (docs/design.md, "Code structure"): each capability
# folder imports only the standard library and shared/. Tool folders (cmd/,
# release/, launcher/, probe/) may import capabilities. Every exception is a
# commented entry here.
version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    errcheck:
      # Diagnostic and protocol output goes to the process's stdout and
      # stderr; when those fail there is no channel left to report on.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # A capability may also import its own sub-packages (checks/build
        # from checks, lifecycle/packs from lifecycle/update): code grows
        # inside its capability, never across.
        capabilities:
          list-mode: strict
          files:
            - "**/hooks/**"
            - "**/license/**"
            - "**/tasks/**"
            - "**/growth/**"
            - "**/sdkserver/**"
            - "**/shared/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
        lifecycle:
          list-mode: strict
          files:
            - "**/lifecycle/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
            - github.com/missingbulb/ClaudiniteEngine/lifecycle
        checks:
          list-mode: strict
          files:
            - "**/checks/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
            - github.com/missingbulb/ClaudiniteEngine/checks/
        checksdk:
          # The public Go check SDK, the one package a pack's Go may import:
          # standard library only, since a pack's checks build offline.
          list-mode: strict
          files:
            - "**/checksdk/**"
          allow:
            - $gostd
        key-ceremony-tool:
          # The key-ceremony workflow builds cn-keys from this public tree
          # with no module downloads: standard library and shared/ only.
          list-mode: strict
          files:
            - "**/cmd/cn-keys/**"
          allow:
            - $gostd
            - github.com/missingbulb/ClaudiniteEngine/shared
